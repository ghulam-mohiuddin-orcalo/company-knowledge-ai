# Production-like rehearsal on one machine (E9-T02 verification, CI). Overlay
# for compose.yaml that builds the release images and replaces the managed
# services with local stand-ins on private networks:
#
#   managed PostgreSQL+pgvector -> postgres         (no host port)
#   managed object storage      -> object-storage   (private bucket, no host port)
#   identity provider           -> oidc (mock, served at https://auth.localhost)
#   AI provider                 -> ai-stub (deterministic, no paid calls)
#
# TLS is real (Caddy's local CA) on https://app.localhost and
# https://api.localhost. Use `infra/deploy/rehearsal.sh` rather than calling this
# directly. Local, non-secret values only (CKA_ENV_FILE=local.env).
name: cka-rehearsal

services:
  edge:
    environment:
      APP_DOMAIN: app.localhost
      API_DOMAIN: api.localhost
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
    networks:
      edge:
        # Containers reach the public hostnames through the edge, like browsers.
        aliases: [app.localhost, api.localhost, auth.localhost]
    healthcheck:
      # Ready once the local CA has issued the site certificates.
      test: ['CMD-SHELL', 'test -f /data/caddy/pki/authorities/local/root.crt']
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      oidc:
        condition: service_healthy

  # Shares the local CA's root certificate so the API can verify
  # https://auth.localhost (JWKS) exactly as it would a public IdP.
  ca-export:
    image: caddy:2.10.2-alpine
    restart: 'no'
    depends_on:
      edge:
        condition: service_healthy
    volumes:
      - caddy-data:/data:ro
      - local-ca:/ca
    command:
      - sh
      - -c
      - cp /data/caddy/pki/authorities/local/root.crt /ca/root.crt && chmod 644 /ca/root.crt

  web:
    image: cka-web:rehearsal
    build:
      context: ../..
      target: web
      args:
        NEXT_PUBLIC_API_URL: https://api.localhost
        NEXT_PUBLIC_OIDC_AUTHORITY: https://auth.localhost/default
        NEXT_PUBLIC_OIDC_CLIENT_ID: company-knowledge-web

  api:
    image: cka-api:rehearsal
    build:
      context: ../..
      target: api
    environment:
      PORT: '3001'
      TRUST_PROXY: '1'
      NODE_EXTRA_CA_CERTS: /ca/root.crt
    volumes:
      - local-ca:/ca:ro
    depends_on:
      ca-export:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      ai-stub:
        condition: service_started

  worker:
    image: cka-worker:rehearsal
    build:
      context: ../..
      target: worker
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      ai-stub:
        condition: service_started

  migrate:
    image: cka-api:rehearsal
    depends_on:
      postgres:
        condition: service_healthy

  provision:
    image: cka-api:rehearsal
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: cka
      POSTGRES_PASSWORD: cka_rehearsal_only
      POSTGRES_DB: company_knowledge
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cka -d company_knowledge']
      interval: 3s
      timeout: 5s
      retries: 30

  object-storage:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        printf '{"identities":[{"name":"rehearsal","credentials":[{"accessKey":"cka_rehearsal_access","secretKey":"cka_rehearsal_secret"}],"actions":["Admin","Read","List","Tagging","Write"]}]}' > /tmp/s3.json
        && exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.port.iceberg=0 -s3.port.lance=0
        -s3.config=/tmp/s3.json
    volumes:
      - object-storage-data:/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz']
      interval: 3s
      timeout: 5s
      retries: 40

  storage-init:
    image: amazon/aws-cli:2.37.9
    restart: 'no'
    depends_on:
      object-storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: cka_rehearsal_access
      AWS_SECRET_ACCESS_KEY: cka_rehearsal_secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        aws --endpoint-url http://object-storage:8333 s3api head-bucket --bucket cka-documents 2>/dev/null
        || aws --endpoint-url http://object-storage:8333 s3api create-bucket --bucket cka-documents
    networks: [backend]

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.4
    environment:
      JSON_CONFIG: '{"interactiveLogin": true}'
    networks: [edge]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://127.0.0.1:8080/default/.well-known/openid-configuration || exit 1',
        ]
      interval: 3s
      timeout: 5s
      retries: 40

  ai-stub:
    image: cka-ai-stub:rehearsal
    build:
      context: ../..
      target: ai-stub
    networks: [backend]

volumes:
  postgres-data: {}
  object-storage-data: {}
  local-ca: {}
