# Local development dependencies (E0-T02).
# Application services (web/api/worker) run host-side via `pnpm dev`.
# Ports are bound to 127.0.0.1 only; credentials here are for local development only.
name: cka

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cka_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-company_knowledge}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible object storage (SeaweedFS). Anonymous access is denied
  # because an identity is configured; buckets are private.
  object-storage:
    image: chrislusf/seaweedfs:4.48
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-cka_local_access}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-cka_local_secret}
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        printf '{"identities":[{"name":"local-dev","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        && exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.port.iceberg=0 -s3.port.lance=0
        -s3.config=/tmp/s3.json
    ports:
      - '127.0.0.1:${S3_PORT:-8333}:8333'
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz']
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot, idempotent bucket bootstrap. Safe to re-run.
  storage-init:
    image: amazon/aws-cli:2.37.9
    depends_on:
      object-storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-cka_local_access}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-cka_local_secret}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-cka-documents-local}
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        if aws --endpoint-url http://object-storage:8333 s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null;
        then echo "Bucket $$S3_BUCKET already exists";
        else aws --endpoint-url http://object-storage:8333 s3api create-bucket --bucket "$$S3_BUCKET"
        && echo "Bucket $$S3_BUCKET created"; fi

  # Development/E2E-only OIDC provider (opt-in: `pnpm infra:auth`). Never used in
  # production. Interactive login accepts any username; the claims JSON entered at
  # login becomes the token's claims, so include email, name and the API audience:
  # {"email": "you@example.test", "name": "You", "aud": "company-knowledge-api"}
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.4
    profiles: ['auth']
    environment:
      JSON_CONFIG: '{"interactiveLogin": true}'
    ports:
      - '127.0.0.1:${OIDC_PORT:-8080}:8080'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://127.0.0.1:8080/default/.well-known/openid-configuration || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  object-storage-data:
