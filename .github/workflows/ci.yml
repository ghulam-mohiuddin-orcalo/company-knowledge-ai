name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    name: Migrations, integration, security and RAG evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Matches the local-development defaults in infra/docker/compose.yaml (CI-only services;
      # storage tests use the same compose defaults).
      DATABASE_URL: postgresql://cka:cka_local_dev@127.0.0.1:5432/company_knowledge
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: pnpm install --frozen-lockfile

      # Same local stack as development: pgvector PostgreSQL + private S3-compatible storage.
      - name: Start PostgreSQL (pgvector) and object storage
        run: pnpm infra:up

      - name: Migrate empty database from zero
        run: pnpm db:migrate

      - run: pnpm test:integration

      # E1-T06/E8-T04: cross-tenant, role-bypass, citation-tampering, prompt-injection,
      # invalid-upload, safe-rendering and abuse-control regression suite. Required gate.
      - name: Security regression suite
        run: pnpm test:security

      # E4-T04/E5-T06: offline retrieval + RAG regression against the committed baseline.
      - name: RAG evaluation regression gate
        run: pnpm eval

  e2e:
    name: Browser end-to-end and security (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: pnpm install --frozen-lockfile

      # Local stack plus the mock OIDC provider (compose profile `auth`). The suite
      # creates its own database and uses a deterministic stand-in AI server.
      - name: Start PostgreSQL, object storage and mock OIDC provider
        run: pnpm infra:up && pnpm infra:auth

      - name: Install Chromium
        run: pnpm --filter @cka/e2e exec playwright install --with-deps chromium

      # E7 product flows and E8-T04 browser security checks (XSS, CSP, tampering).
      - name: End-to-end suite
        run: pnpm test:e2e

  deploy-rehearsal:
    name: Production images and deployment rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: pnpm install --frozen-lockfile

      # E9-T01/T02: builds the web/API/worker production images, then deploys the
      # hosted topology (TLS edge, private PostgreSQL/storage, mock IdP, AI stand-in)
      # with the runbook's explicit migrate and provision steps.
      - name: Build images and deploy the rehearsal stack
        run: pnpm deploy:rehearsal up

      # Images refuse to start without valid production configuration.
      - name: Production configuration is validated at startup
        run: |
          if docker run --rm -e NODE_ENV=production cka-api:rehearsal; then
            echo 'API started without configuration' >&2; exit 1
          fi
          if docker run --rm -e NODE_ENV=production cka-worker:rehearsal; then
            echo 'Worker started without configuration' >&2; exit 1
          fi

      - name: Deployment smoke test (TLS, readiness, headers, exposure)
        run: pnpm deploy:rehearsal smoke

      - name: Install Chromium
        run: pnpm --filter @cka/e2e exec playwright install --with-deps chromium

      # E9-T04: the demo path in a browser against the deployed stack.
      - name: Demo path against the deployment
        run: DEPLOY_LOCAL_CA=1 pnpm test:deploy

      - name: Service logs on failure
        if: failure()
        run: pnpm deploy:rehearsal logs --no-color --tail 200 || true
