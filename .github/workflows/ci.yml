name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    name: Migrations, integration and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Matches the local-development defaults in infra/docker/compose.yaml (CI-only database).
      DATABASE_URL: postgresql://cka:cka_local_dev@127.0.0.1:5432/company_knowledge
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL (pgvector)
        run: docker compose -f infra/docker/compose.yaml up -d --wait postgres

      - name: Migrate empty database from zero
        run: pnpm db:migrate

      - run: pnpm test:integration

      # E1-T06: cross-tenant isolation and route-protection suite. Required gate.
      - name: Cross-tenant security suite
        run: pnpm test:security
